<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Rejection Confirmation | The Academic Pulse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#eaf1ff",
                    "on-primary": "#ffffff",
                    "tertiary": "#005338",
                    "inverse-surface": "#213145",
                    "on-secondary-fixed": "#001e2f",
                    "inverse-primary": "#c3c0ff",
                    "surface-variant": "#d3e4fe",
                    "surface-bright": "#f8f9ff",
                    "on-surface-variant": "#464555",
                    "on-primary-fixed-variant": "#3323cc",
                    "secondary-fixed": "#c9e6ff",
                    "on-error": "#ffffff",
                    "secondary": "#006591",
                    "surface-container": "#e5eeff",
                    "tertiary-fixed": "#6ffbbe",
                    "surface": "#f8f9ff",
                    "primary-fixed": "#e2dfff",
                    "on-background": "#0b1c30",
                    "error-container": "#ffdad6",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "background": "#f8f9ff",
                    "surface-container-low": "#eff4ff",
                    "surface-dim": "#cbdbf5",
                    "surface-container-lowest": "#ffffff",
                    "primary-container": "#4f46e5",
                    "on-tertiary-container": "#67f4b7",
                    "on-surface": "#0b1c30",
                    "tertiary-fixed-dim": "#4edea3",
                    "tertiary-container": "#006e4b",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#004666",
                    "on-secondary-fixed-variant": "#004c6e",
                    "secondary-fixed-dim": "#89ceff",
                    "on-tertiary-fixed": "#002113",
                    "on-primary-container": "#dad7ff",
                    "surface-container-high": "#dce9ff",
                    "outline-variant": "#c7c4d8",
                    "outline": "#777587",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#d3e4fe",
                    "primary-fixed-dim": "#c3c0ff",
                    "secondary-container": "#39b8fd",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-primary-fixed": "#0f0069",
                    "surface-tint": "#4d44e3",

                    "DEFAULT": "1rem",

                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-transition {
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<!-- Blurred Background Content (Dashboard Shell) -->
<div class="fixed inset-0 z-0 flex blur-md saturate-50 brightness-95 overflow-hidden">
<!-- SideNav Simulation -->
<aside class="w-64 bg-slate-100 h-full p-6 flex flex-col gap-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-primary rounded-xl"></div>
<div class="h-6 w-32 bg-slate-300 rounded"></div>
</div>
<nav class="flex flex-col gap-4">
<div class="h-10 w-full bg-slate-200 rounded-full"></div>
<div class="h-10 w-full bg-indigo-100 rounded-full"></div>
<div class="h-10 w-full bg-slate-200 rounded-full"></div>
<div class="h-10 w-full bg-slate-200 rounded-full"></div>
</nav>
</aside>
<!-- Main Content Simulation -->
<main class="flex-1 p-12 bg-surface flex flex-col gap-10">
<header class="flex justify-between items-end">
<div class="space-y-2">
<div class="h-4 w-24 bg-slate-200 rounded"></div>
<div class="h-10 w-64 bg-slate-300 rounded"></div>
</div>
<div class="h-12 w-48 bg-primary rounded-full"></div>
</header>
<div class="grid grid-cols-3 gap-8">
<div class="col-span-2 grid grid-cols-2 gap-6">
<div class="h-64 bg-white rounded-xl"></div>
<div class="h-64 bg-white rounded-xl"></div>
<div class="h-96 col-span-2 bg-white rounded-xl"></div>
</div>
<div class="h-full bg-white rounded-xl"></div>
</div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-on-surface/10 backdrop-blur-sm">
<!-- Rejection Confirmation Card -->
<div class="relative w-full max-w-md bg-surface-container-lowest rounded-xl p-10 text-center shadow-2xl border border-outline-variant/10">
<!-- Icon Cluster -->
<div class="mb-8 flex justify-center">
<div class="relative">
<!-- Outer Halo -->
<div class="absolute inset-0 scale-150 bg-error-container/30 rounded-full blur-xl"></div>
<!-- Icon Container -->
<div class="relative w-20 h-20 bg-error-container flex items-center justify-center rounded-full">
<span class="material-symbols-outlined text-error text-4xl" data-icon="person_remove" style="">person_remove</span>
</div>
</div>
</div>
<!-- Content Hierarchy -->
<div class="space-y-4 mb-10">
<h1 class="font-headline text-3xl font-bold tracking-tight text-on-surface" style="">Candidate Rejected
                </h1>
<p class="text-on-surface-variant leading-relaxed px-4" style="">
                    The candidate has been notified that their application was not successful for this cycle.
                </p>
</div>
<!-- Action Area -->
<div class="space-y-6">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-semibold py-4 px-8 rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200" style="">
                    Done
                </button>
<div class="pt-2">
<span class="text-xs font-label uppercase tracking-widest text-outline" style="">
                        Academic Pulse Talent Manager
                    </span>
</div>
</div>
<!-- Subtle Decorative Elements -->
<div class="absolute top-0 right-0 p-8 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-8xl" data-icon="policy" style="">policy</span>
</div>
</div>
</div>
<!-- Background Decoration (Global) -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 bg-secondary-fixed-dim/20 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-24 -right-24 w-96 h-96 bg-primary-fixed-dim/10 rounded-full blur-3xl -z-10"></div>
